name: Touba Infos CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: touba-infos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Types, lint, tests, compilation et MCP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Aucun secret de production : la base de données n'est pas utilisée
      # (stockage fichier local) et le connecteur MCP reçoit un secret de
      # TEST généré pendant le job (scripts/mcp-e2e-local.sh).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests unitaires et d'intégration
        run: npm test

      - name: Compilation de production
        run: npm run build

      - name: Test MCP de bout en bout (client officiel du SDK)
        run: npm run test:mcp-e2e

      - name: Audit des dépendances de production (critiques)
        run: npm audit --omit=dev --audit-level=critical

  secrets:
    name: Recherche de secrets dans les commits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Gitleaks (commits de la PR ou du push)
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set +e
          # PR : tous ses commits. Push : tous les commits poussés.
          # Premier push d'une branche (before = 000…) ou dispatch : historique complet.
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$PUSH_BEFORE..$SHA"
          else
            RANGE="$SHA"
          fi
          echo "Plage analysée : $RANGE"
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --no-banner --redact \
            --config /repo/.gitleaks.toml \
            --gitleaks-ignore-path /repo/.gitleaksignore \
            --log-opts="$RANGE" \
            --report-format json --report-path /repo/gitleaks-report.json
          status=$?
          # Constats publiés en annotations (valeurs masquées par --redact).
          if [ -s gitleaks-report.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks \(.RuleID) (commit \(.Commit[0:7]))"' gitleaks-report.json
          fi
          exit $status
